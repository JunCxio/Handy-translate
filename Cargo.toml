[package]
name = "handy-translate"
version = "0.6.4"
edition = "2024"
description = "可自选翻译服务的游戏翻译桌面应用"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
axum = "0.8"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
toml = "0.9"
whatlang = "0.18"

[target.'cfg(windows)'.dependencies]
rfd = "0.18"
tao = "0.37"
wry = "0.57"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
